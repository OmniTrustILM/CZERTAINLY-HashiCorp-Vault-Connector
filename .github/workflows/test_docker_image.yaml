name: Test Docker image

on:
  pull_request:
    branches: [ main*, feat/*, hotfix/* ]
  workflow_dispatch:

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}-docker-test
  cancel-in-progress: true

permissions:
  contents: read
  packages: read
  security-events: write

jobs:
  test:
    uses: OmniTrustILM/.github/.github/workflows/containers-test.yml@main
    with:
      image: ilm/hashicorp-vault-connector
      cache-scope: hashicorp-vault-connector
      # The Dockerfile builds the Go binary from the sources.
      pre-build: none
      # Stamp main.version (Dockerfile VERSION arg).
      build-args: |
        VERSION=${{ github.ref_name }}
